name: fast ci
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: check automation and select relevant checks
        id: scope
        run: |
          node --test .github/*.test.mjs
          if git diff --name-only HEAD^ HEAD | grep -Ev '^(\.github/|AGENTS\.md$|README\.md$|.*\.md$)' >/dev/null; then echo 'code=true' >> "$GITHUB_OUTPUT"; fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.scope.outputs.code == 'true'
        with:
          bun-version: '1.3.14'
      - name: check client and signing units
        if: steps.scope.outputs.code == 'true'
        working-directory: opencode
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test
